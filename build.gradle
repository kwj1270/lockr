import org.jooq.meta.jaxb.ForcedType
import org.jooq.meta.jaxb.Generate
import org.jooq.meta.jaxb.Strategy

buildscript {
    ext {
        jooqVersion = '3.19.31'
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'dev.monosoul.jooq-docker' version "7.0.22"
}

group = 'com.official.lockr'
version = '0.0.1-SNAPSHOT'
description = 'lockr'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(24)
    }
}

sourceSets {
    main {
        java {
            srcDirs = ["src/main/java", "src/generated"]
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.session:spring-session-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.retry:spring-retry:2.0.12'
    implementation 'org.springframework.security:spring-security-crypto'

    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'com.github.f4b6a3:ulid-creator:5.2.4'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    implementation 'io.jsonwebtoken:jjwt-impl:0.13.0'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.6'
    implementation 'com.google.firebase:firebase-admin:9.8.0'

    implementation('org.springframework.boot:spring-boot-starter-jooq') {
        exclude group: 'org.jooq:jooq'
    }

    runtimeOnly 'com.mysql:mysql-connector-j'

    jooqCodegen project(':jooq-custom')
    jooqCodegen "org.jooq:jooq:${jooqVersion}"
    jooqCodegen "org.jooq:jooq-meta:${jooqVersion}"
    jooqCodegen "org.jooq:jooq-codegen:${jooqVersion}"
    jooqCodegen 'org.flywaydb:flyway-core:11.8.1'
    jooqCodegen 'org.flywaydb:flyway-mysql:11.8.1'
    jooqCodegen 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.flywaydb:flyway-core:11.8.1'
    implementation 'org.flywaydb:flyway-mysql:11.8.1'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.rest-assured:rest-assured:5.5.7'
    testImplementation 'io.rest-assured:json-path:5.5.7'
    testImplementation 'com.h2database:h2:2.4.240'
    testAndDevelopmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Cucumber BDD
    testImplementation 'io.cucumber:cucumber-java:7.34.3'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.34.3'
    testImplementation 'org.junit.platform:junit-platform-suite:1.12.2'
    // Spring 통합 테스트 시 주석 해제:
    // testImplementation 'io.cucumber:cucumber-spring:7.15.0'
}

tasks.named('test') {
    useJUnitPlatform()
}

jooq {
    version = "${jooqVersion}"
    withContainer {
        image {
            name = "mysql:8.0.29"
            envVars = [
                    MYSQL_ROOT_PASSWORD: "1234",
                    MYSQL_DATABASE     : "lockr"
            ]
        }

        db {
            username = "root"
            password = "1234"
            name = "lockr"
            port = 3306
            jdbc {
                schema = "jdbc:mysql"
                driverClassName = "com.mysql.cj.jdbc.Driver"
            }
        }
    }
}


tasks {
    generateJooqClasses {
        schemas.set(["lockr"])
        outputDirectory.set(project.layout.projectDirectory.dir("src/generated"))
        includeFlywayTable.set(false)

        usingJavaConfig {
            generate = new Generate()
                    .withJavaTimeTypes(true)
                    .withDeprecated(false)
                    .withDaos(true)
                    .withFluentSetters(true)
                    .withRecords(true)

            withStrategy(
                    new Strategy().withName("jooq.custom.generator.JPrefixGeneratorStrategy")
            )

            database.withForcedTypes(
                    new ForcedType()
                            .withUserType("java.lang.Long")
                            .withTypes("int unsigned"),
                    new ForcedType()
                            .withUserType("java.lang.Boolean")
                            .withTypes("(?i:tinyint\\(1\\))"),
                    new ForcedType()
                            .withUserType("java.lang.Integer")
                            .withTypes("tinyint unsigned"),
                    new ForcedType()
                            .withUserType("java.lang.Integer")
                            .withTypes("smallint unsigned"),
            )
        }
    }
}
