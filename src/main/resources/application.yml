server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: JSESSIONID
        http-only: true  # XSS 방지
        secure: true
        same-site: strict # CSRF 방지
        max-age: 3000
spring:
  application:
    name: lockr
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:mysql://${LOCKR_DATABASE_DATA_SOURCE_URL:localhost:3306/lockr}
    username: ${LOCKR_DATABASE_DATA_SOURCE_USER_NAME:root}
    password: ${LOCKR_DATABASE_DATA_SOURCE_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jooq:
    sql-dialect: mysql
  data:
    redis:
      host: ${LOCKR_REDIS_HOST:localhost}
      port: ${LOCKR_REDIS_PORT:6379}
      repositories:
        enabled: false
  docker:
    compose:
      enabled: true  # Docker Compose 자동 시작 활성화
      file: docker-compose.yaml  # Docker Compose 파일 경로
      lifecycle-management: start_only  # 애플리케이션 종료 시 컨테이너 유지
      # start_and_stop: 애플리케이션 종료 시 컨테이너도 중지
      # start_only: 애플리케이션 종료해도 컨테이너 유지 (기본값)
      start:
        command: up  # docker compose up 명령 실행
      stop:
        command: down  # docker compose down 명령 실행 (lifecycle-management가 start_and_stop일 때만)
        timeout: 10s  # 컨테이너 중지 타임아웃
management:
  server:
    port: ${METRIC_SERVER_PORT:18080}
  endpoint:
    prometheus:
      access: read_only
  endpoints:
    web:
      base-path: ${METRIC_PATH:/prefer}
      exposure:
        exclude:
        include: prometheus
    jmx:
      exposure:
        exclude:
        include: prometheus
    access:
      default: read_only
firebase:
  credentials:
    path: ${FIREBASE_CREDENTIALS_PATH:firebase-service-account.json}

logging:
  level:
    root: INFO
