server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: JSESSIONID
        http-only: true  # XSS 방지
        secure: true
        same-site: strict # CSRF 방지
        max-age: 600
spring:
  application:
    name: lockr
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:mysql://${LOCKR_DATABASE_DATA_SOURCE_URL:localhost:3306/lockr}
    username: ${LOCKR_DATABASE_DATA_SOURCE_USER_NAME:root}
    password: ${LOCKR_DATABASE_DATA_SOURCE_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jooq:
    sql-dialect: mysql
  data:
    redis:
      host: ${LOCKR_REDIS_HOST:localhost}
      port: ${LOCKR_REDIS_PORT:6379}
      repositories:
        enabled: false
  docker:
    compose:
      skip:
        in-tests: false
      enabled: true
      file: docker-compose.yaml
      lifecycle-management: start_only
      start:
        command: up
      stop:
        command: down
        timeout: 10s
management:
  server:
    port: ${METRIC_SERVER_PORT:18080}
  endpoint:
    prometheus:
      access: read_only
  endpoints:
    web:
      base-path: ${METRIC_PATH:/prefer}
      exposure:
        exclude:
        include: prometheus
    jmx:
      exposure:
        exclude:
        include: prometheus
    access:
      default: read_only
logging:
  level:
    root: INFO
